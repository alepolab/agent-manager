# How a ticket becomes code, an environment and a verdict.
#
# A ticket resolves to repos, a branch, a stack profile and test commands from
# this file alone, with no human looking anything up. Adding an application to
# the pipeline is an entry here and a passing registry check.
#
# Each repo champion owns their product's entry. A failing entry blocks
# dispatch to that product — not the pipeline.
#
# Validated by: node scripts/validate-registry.mjs
# Schema:       registry/schemas/products.schema.json
#
# NEEDS CONFIRMATION (marked CONFIRM below): branch policies, test commands and
# owner groups are drawn from the repo map and are first drafts. A wrong value
# fails the registry check loudly rather than corrupting a ticket, which is why
# they are committed as drafts rather than left blank.

products:
  aaa:
    suite: aaa
    match:
      components: [AAA, RADIUS]
    repos: [alepolab/aaa_rhel8]
    version_source: customer_profile          # CONFIRM: which Jira field carries the deployed version
    branches:
      bug: 'release/{version}'                # CONFIRM: aaa_rhel8's default is master
      feature: master
      infra: master
    forward_port: master                      # CONFIRM
    stack:
      compose: alepo-dev-team-infra/aaa
      # Two nodes is the default deliberately: per-process state is not a
      # correctness mechanism, and a single-node stack cannot fail the
      # tombstone class of bug that a reviewer caught by hand.
      topology_default: 2node
      liquibase: true
    build: 'make build'                       # CONFIRM
    tests:
      unit: 'make test'                       # CONFIRM
      atdd: 'robot --xunit out.xml tests/aaa' # blocked on V2 (--xunit not yet emitted)
      regression: atdd-aaa
    owners:
      protocol: aaa-tech-leads                # CONFIRM: group names
      money: billing-owners
      schema: aaa-tech-leads

  pcrf:
    suite: aaa
    match:
      components: [PCRF, Policy]
      projects: [PCRFV]
    repos: [alepolab/pcrf_cpp14, alepolab/pcrf-ems-portal]
    multi_repo: true
    branches:
      bug: development
      feature: development
    stack:
      compose: alepo-dev-team-infra/pcrf
      topology_default: 2node                 # CONFIRM: PCRF deploys in pairs
      liquibase: true
    tests:
      unit: 'ctest'                           # CONFIRM
      ui_trace: playwright                    # EMS portal has a UI surface
    owners:
      protocol: pcrf-tech-leads               # CONFIRM
      schema: pcrf-tech-leads
      ui_parsing: pcrf-ems-owners

  ffm:
    suite: bss
    match:
      components: [FFM, Fulfilment]
    repos: [alepolab/ffm]
    branches:
      bug: develop
      feature: develop
    stack:
      compose: alepo-dev-team-infra/ffm
      topology_default: 1node
      liquibase: false                        # CONFIRM: FFM is Flask + Celery + Mongo
    tests:
      unit: 'pytest'                          # CONFIRM
      ui_trace: playwright                    # Vue 3 front end
    owners:
      ui_parsing: ffm-owners                  # CONFIRM
      schema: ffm-owners

  pms:
    suite: bss
    match:
      components: [PMS, Partner]
    repos: [alepolab/pms]
    multi_repo: false                          # monorepo: Node + Python billing + rating
    branches:
      bug: develop
      feature: develop
    stack:
      compose: alepo-dev-team-infra/pms
      topology_default: 1node
      liquibase: false                        # CONFIRM
    tests:
      unit: 'npm test'                        # CONFIRM: monorepo has three runtimes
      ui_trace: playwright
    owners:
      money: billing-owners                   # PMS carries billing and rating paths
      ui_parsing: pms-owners
      schema: pms-owners

  vms:
    suite: bss
    match:
      components: [VMS, Voucher]
    repos: [alepolab/voucher-management]
    branches:
      bug: main                               # CONFIRM
      feature: main
    stack:
      compose: alepo-dev-team-infra/vms
      topology_default: 1node
      liquibase: false
    tests:
      unit: 'npm test'                        # CONFIRM
      ui_trace: playwright                    # React 19 front end
    owners:
      money: billing-owners                   # vouchers are a money path
      ui_parsing: vms-owners

  selfcarenow:
    suite: bss
    match:
      projects: [SCN]
      labels: [NEW_WEB_SELFCARE]
      components: [Selfcare, SelfcareNow]
    repos: [alepolab/selfcarenow]
    branches:
      bug: main                               # CONFIRM: origin HEAD is main; the team works on integrate/primary-develop
      feature: main
    stack:
      # Product-owned compose in its checkout; not yet in alepo-dev-team-infra.
      # The provisioner reads recipes/selfcarenow.md for the quirks.
      compose: selfcarenow/docker-compose.yml
      topology_default: 1node
    tests:
      unit: 'pnpm --filter @selfcare/web test'  # CONFIRM
      ui_trace: playwright
    owners:
      protocol: selfcare-leads                # CONFIRM
      ui_parsing: selfcare-leads

  # Infrastructure work on the shared compose repo itself. DEVOPS tickets
  # routed nowhere before this entry, so an infra run started with no repo,
  # branch or test facts. Everything marked CONFIRM is a best guess from the
  # DEVOPS-15 run, which authored a test in this repo; the devops owners
  # should correct it.
  infra:
    suite: platform
    match:
      projects: [DEVOPS]
    repos: [alepolab/alepo-dev-team-infra]
    branches:
      bug: main                               # CONFIRM
      feature: main                           # CONFIRM
      infra: main
    stack:
      # The repo is the stack: a change here is verified by bringing up the
      # profile it touches, named in the ticket, not a fixed product profile.
      compose: alepo-dev-team-infra           # CONFIRM
      topology_default: 1node
    tests:
      unit: 'npm test'                        # CONFIRM: the DEVOPS-15 run wrote a test here; check its runner
    owners:
      schema: devops                          # CONFIRM: group name
