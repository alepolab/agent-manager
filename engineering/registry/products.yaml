  # The infrastructure entry, and deliberately LAST in this file.
  #
  # resolveProduct matches in tiers — project key, then labels, then components —
  # and within a tier a product matching the key AND a word beats one matching
  # the key alone; where nothing disambiguates, file order decides. So a PCRF
  # ticket mentioning Docker still resolves to pcrf, and only a ticket no product
  # claims falls through to here.
  #
  # Keycloak, RabbitMQ and Liquibase route here rather than to products of their
  # own because they have no application repository: they exist only as compose
  # services in alepo-dev-team-infra, shared by FFM, CRM, PCRF, VMS and others.
  # A ticket against one of them is a change to this repo by definition — and
  # that sharing is why work on them is worth flagging, since the sso stack is
  # not one team's to recreate.
  #
  # terraform-artifacts is NOT here: it is a separate product below. Both are
  # DEVOPS tickets, but they are different work in different repos — docker and
  # compose here, demo-environment infrastructure there — and a ticket touches
  # one or the other. Listing both on one product would demand a merge order
  # across two changes that never travel together.
  infra:
    suite: bss
    match:
      projects: [DEVOPS]
      labels: [infra, deployment, docker, compose, rabbitmq, keycloak, liquibase]
      # Vocabulary of the deployment estate, never application terms: a term
      # that could belong to an application would steal that application's
      # tickets whenever its own entry missed.
      components: [Docker, Compose, Infra, Infrastructure, Deployment, Dockerfile, GHCR, Registry, Podman, RabbitMQ, Keycloak, SSO, Liquibase]
    repos: [alepolab/alepo-dev-team-infra]
    branches:
      bug: develop
      feature: develop
      infra: develop
    stack:
      # This repo IS the compose estate. A ticket changing it usually needs no
      # separate harness stood up — the provisioner is expected to say so and
      # still leave the checkout behind.
      compose: alepo-dev-team-infra
      topology_default: 1node
    tests:
      unit: 'bats tests'
      compose_test: 'docker compose config'
    owners:
      protocol: devops
      schema: devops
      docs: devops

  # Demo-environment infrastructure. Shares the DEVOPS project with `infra`
  # above, and is reached the same way the EMS entries are: by naming what it is
  # about. `infra` sits above it and takes an unqualified DEVOPS ticket, which is
  # the right default — compose work is the common case.
  demo-infra:
    suite: bss
    match:
      projects: [DEVOPS]
      labels: [terraform, gcp, demo-env]
      components: [Terraform, GCP, Demo Environment, Cloud]
    repos: [alepolab/terraform-artifacts]
    branches:
      # No develop branch on this repo — main is where work lands.
      bug: main
      feature: main
      infra: main
    stack:
      compose: not-applicable
      topology_default: 1node
    tests:
      unit: 'terraform validate'              # CONFIRM
    owners:
      protocol: devops
      docs: devops
