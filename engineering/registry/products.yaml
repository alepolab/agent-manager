# How a ticket becomes code, an environment and a verdict.
#
# A ticket resolves to repos, a branch, a stack profile and test commands from
# this file alone, with no human looking anything up. Adding an application to
# the pipeline is an entry here and a passing registry check.
#
# Each repo champion owns their product's entry. A failing entry blocks
# dispatch to that product — not the pipeline.
#
# Validated by: node scripts/validate-registry.mjs
# Schema:       registry/schemas/products.schema.json
#
# NEEDS CONFIRMATION (marked CONFIRM below): test commands, stack profiles and
# owner groups are first drafts. A wrong value fails the registry check loudly
# rather than corrupting a ticket, which is why they are committed as drafts
# rather than left blank.
#
# Branch policies are NOT drafts. Every one was read from the repository:
# `develop` where the repo has one, `development` for the three C++ repos that
# use that spelling, and `main` for the two with neither. ocs_cpp14 carries
# both spellings and `development` is the live one - last commit 31 Aug against
# 18 Jul on `develop`.
#
# Two Jira projects serve two products each: AAA is the server and the EMS
# portal, PCRFV likewise. resolveProduct prefers the product that matches the
# project key AND a component word over one matching the key alone, so the EMS
# entries carry the words that distinguish them. Order still decides where
# nothing does: the server entries come first and take an unqualified ticket.

products:

  crm:
    # ase_lbss is a multi-repo workspace: each modules/* is its own git repo.
    # The CI build workflow is the list of what actually ships.
    suite: crm
    match:
      projects: [CRM]
      components: [CRM, Liferay]
    repos: [alepolab/ase_lbss]
    branches:
      bug: develop
      feature: develop
      infra: develop
    stack:
      compose: alepo-dev-team-infra/crm
      topology_default: 1node
    tests:
      unit: 'CONFIRM'
    owners:
      protocol: crm-leads              # CONFIRM
      ui_parsing: crm-leads           # CONFIRM

  billing:
    # Submodules, not a monorepo - read .gitmodules for the member repos.
    suite: billing
