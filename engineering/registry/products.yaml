# How a ticket becomes code, an environment and a verdict.
#
# A ticket resolves to repos, a branch, a stack profile and test commands from
# this file alone, with no human looking anything up. Adding an application to
# the pipeline is an entry here and a passing registry check.
#
# Each repo champion owns their product's entry. A failing entry blocks
# dispatch to that product — not the pipeline.
#
# Validated by: node scripts/validate-registry.mjs
# Schema:       registry/schemas/products.schema.json
#
# NEEDS CONFIRMATION (marked CONFIRM below): branch policies, test commands and
# owner groups are drawn from the repo map and are first drafts. A wrong value
# fails the registry check loudly rather than corrupting a ticket, which is why
# they are committed as drafts rather than left blank.
#
# images / version.strategy / version.hint were measured, not guessed: every
# entry below was checked against `gh api /orgs/alepolab/packages?package_type=container`
# and the package's own `repository.full_name` link (not assumed from the repo
# name), on 2026-09-03/04. See engineering/docs/product-registry.md for the raw
# evidence and for the products this could not resolve.
#
# upgrade_policy has no such evidence source — GHCR shows tags, not customer
# support terms. Every upgrade_policy below is `pinned` and marked CONFIRM: a
# fail-safe default, because a wrong `can_upgrade` tells a customer who cannot
# upgrade to go upgrade, while a wrong `pinned` only costs an unnecessary
# backport. Confirm per product before this drives a real ticket.
#
# match.unconfirmed: true (cgw, pc, cm, rpm, billing, ocs, selfcare, crm, urm,
# wso2, tacacs-platform, ams, added 2026-09-04) marks routing that has no
# evidence source at all — the Jira instance's 50+ projects are overwhelmingly
# customer-engagement and CR buckets (AFGMB, ALLO, ACTBB, AFDRC, ...), not
# product routers, so components/projects/labels cannot be derived the way
# images/version were. An unconfirmed product carries no components, projects
# or labels — the registry check rejects an entry that sets both — so it is
# present, documented and ready for a repo champion to confirm, but cannot
# silently claim a ticket in the meantime. A wrong match is worse than a
# missing product: it quietly sends a ticket to the wrong repo instead of
# failing loudly.

products:
  aaa:
    match:
      components: [AAA, RADIUS]
    repos: [alepolab/aaa_rhel8]
    version_source: customer_profile          # CONFIRM: which Jira field carries the deployed version
    branches:
      bug: 'release/{version}'                # CONFIRM: aaa_rhel8's default is master
      feature: master
      infra: master
    forward_port: master                      # CONFIRM
    stack:
      compose: alepo-dev-team-infra/aaa
      # Two nodes is the default deliberately: per-process state is not a
      # correctness mechanism, and a single-node stack cannot fail the
      # tombstone class of bug that a reviewer caught by hand.
      topology_default: 2node
      liquibase: true
    build: 'make build'                       # CONFIRM
    tests:
      unit: 'make test'                       # CONFIRM
      atdd: 'robot --xunit out.xml tests/aaa' # blocked on V2 (--xunit not yet emitted)
      regression: atdd-aaa
    owners:
      protocol: aaa-tech-leads                # CONFIRM: group names
      money: billing-owners
      schema: aaa-tech-leads
    # Evidence: gh api /orgs/alepolab/packages/container/<pkg> .repository.full_name
    # aaa-server-oel9-mysql, aaa-server-release-mysql, aaa-builder-oel{8,9} all
    # link to alepolab/aaa_rhel8. Excluded: a whole family of packages named
    # aaa-server-<major.minor.patch>-oel{8,9}-mysql (e.g. aaa-server-14.0.3-oel9-mysql)
    # also link to this repo — one GHCR package per release, not a tag. Their
    # own tags are build timestamps only (2026-03-09-07-53-58), never a version.
    images: [aaa-server-oel9-mysql, aaa-server-release-mysql, aaa-builder-oel8, aaa-builder-oel9]
    version:
      strategy: versioned_image_name
      hint: >-
        The version is the GHCR package name, not a tag: look for
        aaa-server-<major.minor.patch>-oel{8,9}-mysql (e.g. aaa-server-14.0.3-oel9-mysql).
        aaa-server-oel9-mysql and aaa-server-release-mysql are the unversioned
        rolling/RC packages; their tags are a build timestamp
        (2026-03-09-07-53-58) or an RC suffix (14.0.3-rc) and do not name a
        release on their own.
    upgrade_policy: pinned                    # CONFIRM: fail-safe default, no evidence

  pcrf:
    match:
      components: [PCRF, Policy]
      projects: [PCRFV]
    repos: [alepolab/pcrf_cpp14, alepolab/pcrf-ems-portal]
    multi_repo: true
    branches:
      bug: development
      feature: development
    stack:
      compose: alepo-dev-team-infra/pcrf
      topology_default: 2node                 # CONFIRM: PCRF deploys in pairs
      liquibase: true
    tests:
      unit: 'ctest'                           # CONFIRM
      ui_trace: playwright                    # EMS portal has a UI surface
    owners:
      protocol: pcrf-tech-leads               # CONFIRM
      schema: pcrf-tech-leads
      ui_parsing: pcrf-ems-owners
    # Evidence: alepopcrf-14 links to alepolab/pcrf_cpp14; pcrf-ems-portal and
    # pcrf-ems-portal-agent both link to alepolab/pcrf-ems-portal.
    images: [alepopcrf-14, pcrf-ems-portal, pcrf-ems-portal-agent]
    version:
      strategy: semver_tag
      hint: >-
        The customer-facing PCRF version is on alepopcrf-14 (repo pcrf_cpp14):
        vMAJOR.MINOR.PATCH, also emitted with a -debug or -rc.N suffix (e.g.
        v14.0.2, v14.0.2-debug, v14.0.0-rc.3). That package also carries
        YYYYMMDD nightly tags (20260824) with no version in them — ignore
        those. pcrf-ems-portal and pcrf-ems-portal-agent (the EMS UI, a
        separate repo) are tagged develop-YYYYMMDD-sha / ci-release-YYYYMMDD-sha
        instead, with no matching semver — this multi_repo product does NOT
        share one version scheme across its repos; resolving the EMS portal's
        matching build is a date-proximity lookup around the engine release,
        not a tag match, and is out of scope for this field.
    upgrade_policy: pinned                    # CONFIRM: fail-safe default, no evidence

  ffm:
    match:
      components: [FFM, Fulfilment]
    repos: [alepolab/ffm]
    branches:
      bug: develop
      feature: develop
    stack:
      compose: alepo-dev-team-infra/ffm
      topology_default: 1node
      liquibase: false                        # CONFIRM: FFM is Flask + Celery + Mongo
    tests:
      unit: 'pytest'                          # CONFIRM
      ui_trace: playwright                    # Vue 3 front end
    owners:
      ui_parsing: ffm-owners                  # CONFIRM
      schema: ffm-owners
    # Evidence: ffm-api and ffm-worker both link to alepolab/ffm. Excluded:
    # pycore/ffm-pycore, pycore/ffm-pycore-celery, pycore/ffm-pycore-gunicorn
    # link to alepolab/pycore, a separate shared-library repo, not this one.
    images: [ffm-api, ffm-worker]
    version:
      strategy: branch_date_sha
      hint: >-
        Tags are develop-YYYYMMDD-<shortsha> or ci-release-YYYYMMDD-<shortsha>,
        occasionally with a customer suffix (ci-release-20260827-df9eef1-eswatini).
        No semver tag exists on either image. A ticket that names a release
        number for FFM (e.g. "1.23.0") cannot be matched to an image tag
        directly — resolve from a date or sha found in the ticket's own
        evidence (deployment date, customer profile, comments), not by guessing.
    upgrade_policy: pinned                    # CONFIRM: fail-safe default, no evidence

  pms:
    match:
      components: [PMS, Partner]
    repos: [alepolab/pms]
    multi_repo: false                          # monorepo: Node + Python billing + rating
    branches:
      bug: develop
      feature: develop
    stack:
      compose: alepo-dev-team-infra/pms
      topology_default: 1node
      liquibase: false                        # CONFIRM
    tests:
      unit: 'npm test'                        # CONFIRM: monorepo has three runtimes
      ui_trace: playwright
    owners:
      money: billing-owners                   # PMS carries billing and rating paths
      ui_parsing: pms-owners
      schema: pms-owners
    # Evidence: pms-billing, pms-partner-management and pms-ratingengine all
    # link to alepolab/pms — one repo, three GHCR packages, exactly the split
    # described in the task brief. Confirmed by sampling ~15 versions on each
    # package: every tag observed was sha-<shortsha>, latest, main, develop or
    # ci-release. None is version-shaped, on any of the three.
    images: [pms-billing, pms-partner-management, pms-ratingengine]
    version:
      strategy: none
      hint: >-
        No pms-* package publishes a version-shaped tag today (only
        sha-<shortsha>, latest, main, develop, ci-release were observed on all
        three). A ticket naming a PMS release like "1.23.0" is UNRESOLVABLE
        against these images as they stand — halt and escalate rather than
        substituting develop or guessing a sha. See
        engineering/docs/product-registry.md.
    upgrade_policy: pinned                    # CONFIRM: fail-safe default, no evidence

  vms:
    match:
      components: [VMS, Voucher]
    repos: [alepolab/voucher-management]
    branches:
      bug: main                               # CONFIRM
      feature: main
    stack:
      compose: alepo-dev-team-infra/vms
      topology_default: 1node
      liquibase: false
    tests:
      unit: 'npm test'                        # CONFIRM
      ui_trace: playwright                    # React 19 front end
    owners:
      money: billing-owners                   # vouchers are a money path
      ui_parsing: vms-owners
    # Evidence: the voucher-management GHCR package links to
    # alepolab/voucher-management.
    images: [voucher-management]
    version:
      strategy: semver_tag
      hint: >-
        Release tags are v<major>.<minor>.<patch> (and vX.Y.Z-rc.N
        pre-releases), e.g. v14.0.1, v14.0.0-rc.2. The same package also
        publishes develop-YYYYMMDD-sha / ci-release-YYYYMMDD-sha and a
        floating latest for continuous deploy of pre-release code — ignore
        those when resolving a customer-reported release version.
    upgrade_policy: pinned                    # CONFIRM: fail-safe default, no evidence; vouchers are a money path (see owners.money)


  cgw:
    # charging-gateway. User notes suggest the SA board covers OCS/charging,
    # but that is a hint for a human, not an active match criterion — see
    # match.unconfirmed below and the file header note.
    match:
      unconfirmed: true                      # CONFIRM: no Jira product-routing source found
    repos: [alepolab/charging-gateway]
    branches:
      bug: main                              # CONFIRM: GitHub default branch; repo not in the CLAUDE.md repo map's branch column, policy not independently confirmed
      feature: main
    stack:
      compose: alepo-dev-team-infra/cgw      # matches the compose-profile vocabulary in the CLAUDE.md repo map (cgw)
      topology_default: 1node                # CONFIRM: no HA/pairing evidence found
      liquibase: false                       # CONFIRM
    tests:
      unit: 'npm test'                       # CONFIRM: tech stack not independently confirmed
    owners:
      protocol: cgw-tech-leads               # CONFIRM: group name guessed from domain
      money: billing-owners                  # charging changes what gets billed
    # Evidence: charging-gateway (GHCR package) confirmed linked to
    # alepolab/charging-gateway via repository.full_name. Full 19-tag history
    # sampled (single page, under the per-page cap).
    images: [charging-gateway]
    version:
      strategy: branch_date_sha
      hint: >-
        Tags are develop-YYYYMMDD-<shortsha> / ci-release-YYYYMMDD-<shortsha>
        (full history: 19 unique tags). A single v14.0.0-rc.1 tag exists but
        was never followed by a GA v14.0.0 or any patch — not a resolvable
        release-number convention. Two legacy bare tags (3.0.0, 3.0.1, no v
        prefix) predate the current scheme and don't fit it either. Resolve a
        reported version from the ticket's own date/sha evidence, as with ffm.
    upgrade_policy: pinned                   # CONFIRM: fail-safe default, no evidence

  pc:
    match:
      unconfirmed: true                       # CONFIRM: no Jira product-routing source found
    repos: [alepolab/pc]
    branches:
      bug: main                               # CONFIRM: GitHub default branch; repo not in the CLAUDE.md repo map's branch column
      feature: main
    stack:
      compose: alepo-dev-team-infra/pc        # matches the compose-profile vocabulary (pc)
      topology_default: 1node                 # CONFIRM
      liquibase: false                        # CONFIRM
    tests:
      unit: 'npm test'                        # CONFIRM: tech stack not independently confirmed
    owners:
      schema: pc-owners                       # CONFIRM: group name guessed; Product Catalogue owns catalog/pricing schema
    # Evidence: pc (GHCR package) confirmed linked to alepolab/pc via
    # repository.full_name. Full 144-tag paginated history sampled.
    images: [pc]
    version:
      strategy: semver_tag
      hint: >-
        Release tags are vMAJOR.MINOR.PATCH plus vX.Y.Z-rc.N and
        v1.0.0-beta.N pre-releases (v1.0.0-beta.1 through .5, v14.0.0-rc.1/2/3,
        v14.0.0 GA — full 144-tag history). The CI tags use a malformed
        double-hyphen shape (ci-release--YYYYMMDD-sha, develop--YYYYMMDD-sha —
        worth fixing at the source) but don't collide with the vX.Y.Z shape;
        ignore them along with latest.
    upgrade_policy: pinned                    # CONFIRM: fail-safe default, no evidence

  cm:
    match:
      unconfirmed: true                        # CONFIRM: no Jira product-routing source found
    repos: [alepolab/collection-manager]
    branches:
      bug: main                                # CONFIRM: GitHub default branch; repo not in the CLAUDE.md repo map's branch column
      feature: main
    stack:
      compose: alepo-dev-team-infra/cm         # matches the compose-profile vocabulary (cm)
      topology_default: 1node                  # CONFIRM
      liquibase: false                         # CONFIRM
    tests:
      unit: 'npm test'                         # CONFIRM: tech stack not independently confirmed
    owners:
      money: billing-owners                    # collections/dunning is a money path
      schema: cm-owners                        # CONFIRM: group name guessed
    # Evidence: collection-manager confirmed linked to
    # alepolab/collection-manager via repository.full_name; full paginated
    # history (198 version entries) sampled. Excluded from images:
    # collection-manager-ci-release and collection-manager-develop (same
    # repo, pure CI mirrors — tags are only sha-*/branch names, no version);
    # collection-manager-v1.0.0-beta and collection-manager-v14.0.0-beta-1
    # (same repo, one-off packages with the version baked into the package
    # name, predating the tag-based versioning now used on the main
    # package); and collection-manager-fix/sbn-2932-out-of-dunning-activity
    # (same repo, a stray feature-branch artifact — tags are just a sha and
    # the branch name).
    images: [collection-manager]
    version:
      strategy: semver_tag
      hint: >-
        vMAJOR.MINOR.PATCH release tags with beta/rc pre-releases
        (v1.0.0-beta.1/2, v14.0.0-beta.1, v14.0.0-rc.1-3, v14.0.0, v14.0.1,
        v14.0.2 — full paginated history). See the images: comment above for
        the four excluded sibling packages and why none of them is the
        version source.
    upgrade_policy: pinned                     # CONFIRM: fail-safe default, no evidence; collections is a money path (see owners.money)

  rpm:
    match:
      unconfirmed: true                         # CONFIRM: no Jira product-routing source found
    repos: [alepolab/recharge-promotion-manager]
    branches:
      bug: main                                 # CONFIRM: GitHub default branch; repo not in the CLAUDE.md repo map's branch column
      feature: main
    stack:
      compose: alepo-dev-team-infra/rpm         # matches the compose-profile vocabulary (rpm)
      topology_default: 1node                   # CONFIRM
      liquibase: false                          # CONFIRM
    tests:
      unit: 'npm test'                          # CONFIRM: tech stack not independently confirmed
    owners:
      money: billing-owners                     # recharge/promotions is a money path
      schema: rpm-owners                        # CONFIRM: group name guessed
    # Evidence: recharge-promotion-manager confirmed linked to
    # alepolab/recharge-promotion-manager via repository.full_name. Full
    # 59-tag paginated history sampled.
    images: [recharge-promotion-manager]
    version:
      strategy: semver_tag
      hint: >-
        vMAJOR.MINOR.PATCH tags including v1.0.0-beta.1, v14.0.0-rc.1/2,
        v14.0.0, v14.0.1 (full 59-tag history). One anomalous v2.0.0 tag sits
        outside the v14.x sequence — not part of the current release line,
        ignore it. Ignore develop-YYYYMMDD-sha / ci-release-YYYYMMDD-sha /
        latest CI noise.
    upgrade_policy: pinned                      # CONFIRM: fail-safe default, no evidence; recharge/promotions is a money path (see owners.money)

  billing:
    match:
      unconfirmed: true                          # CONFIRM: no Jira product-routing source found
    repos: [alepolab/billing_cpp14]
    branches:
      bug: main                                  # CONFIRM: GitHub default branch; the CLAUDE.md repo map lists no default branch for billing_cpp14
      feature: main
    stack:
      compose: alepo-dev-team-infra/billing      # matches the compose-profile vocabulary (billing)
      topology_default: 1node                    # CONFIRM
      liquibase: false                           # CONFIRM
    build: 'make build'                          # CONFIRM: C++17 engine, mirrors aaa/pcrf's C++ build step
    tests:
      unit: 'ctest'                               # CONFIRM
      atdd: 'robot --xunit out.xml tests/billing' # CONFIRM: repo map states "Billing engine rbsbill (C++17) + Robot ATDD"
    owners:
      money: billing-owners                      # rbsbill is the core money-processing engine
      schema: billing-tech-leads                 # CONFIRM: group name guessed
    # Evidence: alepobilling-14 and billing-builder-oel9 both confirmed
    # linked to alepolab/billing_cpp14 via repository.full_name. Full 56-tag
    # history sampled on alepobilling-14 (single page, complete); 1 tag on
    # billing-builder-oel9.
    images: [alepobilling-14, billing-builder-oel9]
    version:
      strategy: semver_tag
      hint: >-
        vMAJOR.MINOR.PATCH (optionally -debug) on alepobilling-14 (v14.0.2
        through v14.0.6 sampled, full 56-tag history), plus DDMMYYYY nightly
        tags (e.g. 03092026) and bare debug/latest — ignore those.
        billing-builder-oel9 carries only latest, no version tag (build
        tooling image; included for completeness, ignore for version
        resolution).
    upgrade_policy: pinned                       # CONFIRM: fail-safe default, no evidence; rbsbill is a money path (see owners.money)

  ocs:
    match:
      unconfirmed: true                           # CONFIRM: no Jira product-routing source found; user notes suggest board SA (OCS/charging) but this is a hint, not confirmed routing
    repos: [alepolab/ocs_cpp14]
    branches:
      bug: main                                   # CONFIRM: GitHub default branch; the CLAUDE.md repo map lists no default branch for ocs_cpp14
      feature: main
    stack:
      compose: alepo-dev-team-infra/ocs           # matches the compose-profile vocabulary (ocs)
      topology_default: 1node                     # CONFIRM
      liquibase: false                            # CONFIRM
    build: 'make build'                           # CONFIRM: C++14 engine, mirrors aaa/pcrf's C++ build step
    tests:
      unit: 'ctest'                                # CONFIRM
    owners:
      protocol: ocs-tech-leads                    # CONFIRM: group name guessed; Diameter online charging
      money: billing-owners                       # OCS changes what gets charged
    # Evidence: alepoocs-14 and ocs-builder-oel9 both confirmed linked to
    # alepolab/ocs_cpp14 via repository.full_name. Full 59-tag history
    # sampled on alepoocs-14 (single page, complete); 2 tags on
    # ocs-builder-oel9. Excluded: ocs-ems (GHCR package) confirmed linked to
    # alepolab/ocs-ems — a separate, unlisted repo, not ocs_cpp14, despite
    # the name similarity.
    images: [alepoocs-14, ocs-builder-oel9]
    version:
      strategy: semver_tag
      hint: >-
        vMAJOR.MINOR.PATCH (optionally -debug or -rc.N) on alepoocs-14
        (v14.0.0-rc.3 through v14.0.2 sampled, full 59-tag history), plus
        YYYYMMDD nightly tags and one stray devops18-test — ignore those.
        ocs-builder-oel9 carries only a long-sha tag and latest, no version
        (build tooling image).
    upgrade_policy: pinned                        # CONFIRM: fail-safe default, no evidence; OCS is a money path (see owners.money)

  selfcare:
    match:
      unconfirmed: true                            # CONFIRM: no Jira product-routing source found
    repos: [alepolab/lum-selfcare-v1]
    branches:
      bug: main                                    # CONFIRM: GitHub default branch; the CLAUDE.md repo map lists no default branch for lum-selfcare-v1
      feature: main
    stack:
      compose: alepo-dev-team-infra/selfcare       # matches the compose-profile vocabulary (selfcare)
      topology_default: 1node                      # CONFIRM
      liquibase: false                             # CONFIRM
    tests:
      unit: 'npm test'                             # CONFIRM: Angular + Node per the CLAUDE.md repo map
      ui_trace: playwright                         # Angular front end
    owners:
      ui_parsing: selfcare-owners                  # CONFIRM: group name guessed
    # Evidence: lum-selfcare and lum-selfcare-ci-release both confirmed
    # linked to alepolab/lum-selfcare-v1 via repository.full_name — full
    # 325-tag and 108-tag paginated histories sampled respectively.
    # Excluded: selfcarenow, selfcarenow-develop, selfcarenow-ci-release
    # (confirmed linked to alepolab/selfcarenow) and selfcare (confirmed
    # linked to alepolab/selfcare) — three different, unlisted repos, not
    # lum-selfcare-v1, despite the near-identical package names. This is
    # exactly the repo-name-vs-image-name trap this task's evidence standard
    # exists to catch.
    images: [lum-selfcare, lum-selfcare-ci-release]
    version:
      strategy: semver_tag
      hint: >-
        vMAJOR.MINOR.PATCH on lum-selfcare (v14.0.0-beta.1 through v14.0.17,
        full 325-tag history), plus develop-/ci-release-/main-<date>-<sha> CI
        tags and latest — ignore those. lum-selfcare-ci-release is a pure CI
        mirror package (sha-* and ci-release-<date>-<sha> only, no version
        tag anywhere in its 108-tag full history).
    upgrade_policy: pinned                         # CONFIRM: fail-safe default, no evidence

  crm:
    match:
      unconfirmed: true                             # CONFIRM: no Jira product-routing source found
    repos: [alepolab/ase_lbss]
    branches:
      # CONFIRM: GitHub default branch; the CLAUDE.md repo map lists no
      # default branch for ase_lbss. Note: ase_lbss is itself documented as
      # "a multi-repo workspace: each modules/* is its own git repo" — this
      # entry covers only the top-level container repo and the alepo-crm
      # image confirmed linked to it; the modules/* sub-repos were not
      # evidenced and are out of scope here.
      bug: main
      feature: main
    stack:
      compose: alepo-dev-team-infra/crm             # matches the compose-profile vocabulary (crm)
      topology_default: 1node                       # CONFIRM
      liquibase: false                              # CONFIRM
    tests:
      unit: 'npm test'                              # CONFIRM: tech stack not independently confirmed for the top-level repo
      ui_trace: playwright                          # CRM portal has a UI surface
    owners:
      ui_parsing: crm-owners                        # CONFIRM: group name guessed
      schema: crm-owners                            # CONFIRM
    # Evidence: alepo-crm confirmed linked to alepolab/ase_lbss via
    # repository.full_name. Full 104-tag paginated history sampled.
    images: [alepo-crm]
    version:
      strategy: semver_tag
      hint: >-
        Per-customer builds: <CUSTOMER>-vMAJOR.MINOR.PATCH, e.g.
        SASKTEL-v14.0.0 through SASKTEL-v14.0.13 (a 14-release sequence, full
        104-tag history), plus a separate generic/OWNCORE-style stream
        (v14.0.0, v14.0.0-ga, v14.0.0-ga.rc.1/2) and per-customer rc suffixes
        (v14.0.0-rc.1-SASKTEL through -rc.4-SASKTEL). The customer prefix
        must come from the ticket, not guessed — the same version number is
        not published for every customer. Ignore develop-<sha>,
        ci-release-<sha>, <CUSTOMER>-ci-release-<sha>, and date-suffixed dev
        snapshots (develop-v14.0.0-01.07) — none of these is a release.
    upgrade_policy: pinned                          # CONFIRM: fail-safe default, no evidence

  urm:
    match:
      unconfirmed: true                              # CONFIRM: no Jira product-routing source found
    repos: [alepolab/urm]
    branches:
      bug: main                                      # CONFIRM: GitHub's default_branch is main; the CLAUDE.md repo map states urm's default branch as develop — a real discrepancy, needs a repo champion to confirm the actual integration branch before this drives a checkout
