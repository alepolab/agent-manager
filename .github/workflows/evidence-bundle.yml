# Evidence Bundle CI
#
# Two independent checks on every pull_request:
#
#   evidence-bundle
#     Downloads the run directory an external agent pipeline (e.g. Runbook
#     A's `sdlc-evidence-and-pr` step) is expected to have uploaded as a
#     workflow artifact named `evidence-run-<head-sha>`, assembles it into a
#     bundle (engineering/scripts/assemble-bundle.mjs), validates it against
#     schemas/evidence-bundle.v0.1.schema.json (engineering/scripts/validate-bundle.mjs),
#     renders the one-screen Markdown summary (engineering/scripts/bundle-summary.mjs),
#     and posts the result as a GitHub Check via the Checks API. No artifact,
#     or an artifact missing required evidence, fails the check — that is
#     the entire mechanism. See engineering/docs/evidence-bundle.md for the
#     run-directory contract and, importantly, for what this check does NOT
#     yet guarantee.
#
#   diff-size
#     Fails when a PR changes more than 400 lines or 10 files, excluding
#     test and generated paths. See the check's own output (posted via the
#     Checks API) for why the limit exists — it is not an arbitrary style
#     rule.
#
# IMPORTANT — read before trusting either check:
#   - The evidence-run artifact naming convention (`evidence-run-<sha>`) is
#     this workflow's assumption about a producer that is not part of this
#     plan. Until something actually uploads that artifact, `evidence-bundle`
#     will correctly, but uselessly, fail every PR with "no artifact found".
#   - This workflow has been validated for YAML syntax and the three
#     scripts it orchestrates have been run end to end against a fixture
#     run directory (see engineering/docs/evidence-bundle.md). The Checks
#     API calls themselves are WRITTEN BUT UNVERIFIED — they have never run
#     against a real pull_request event, a real GITHUB_TOKEN, or a real
#     artifact. Treat this workflow as a reviewed draft, not a proven gate.
#   - Permissions are `checks: write`, `pull-requests: write`, `contents:
#     read`, plus `actions: read` (needed for the artifact lookup/download —
#     see the comment on the permissions block below for why this goes
#     beyond the brief's three scopes).
#   - Even once verified, this is NOT a gate: with no branch protection
#     requiring these checks, and no separation between the identity that
#     authored the PR and the identity that would approve it, a red check
#     here is advisory only. See engineering/docs/evidence-bundle.md.

name: Evidence Bundle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: write
  pull-requests: write
  contents: read
  # actions: read is a deliberate addition beyond the brief's three scopes:
  # locating the evidence-run artifact (actions.listArtifactsForRepo) and
  # downloading it cross-run both call the Actions API, which 403s without
  # this scope. Dropping it would make evidence-bundle fail every PR with
  # "no artifact found" even when one exists — a check that looks like it's
  # enforcing evidence but is actually just permission-denied. Read-only,
  # so it stays within least-privilege even though it widens the brief's list.
  actions: read

concurrency:
  group: evidence-bundle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence-bundle:
    name: evidence-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The run directory (meta.json, oracle-before.xml, oracle-after.xml,
      # regression.xml, intent.md, plan.md, summary.md, context-packet.json,
      # optionally spec.md / trace.zip — see engineering/scripts/assemble-bundle.mjs
      # header comment for the full contract) is expected to already exist
      # as a workflow artifact named `evidence-run-<head-sha>`, uploaded by
      # whatever produced the PR. This step only locates it — see the
      # top-of-file caveat: nothing yet uploads it.
      - name: Locate evidence-run artifact
        id: locate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha
            const artifactName = `evidence-run-${headSha}`
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 1,
            })
            const artifact = data.artifacts.find((a) => !a.expired)
            if (!artifact) {
              core.notice(`no artifact named "${artifactName}" found — evidence-bundle will fail`)
              core.setOutput('found', 'false')
              return
            }
            core.setOutput('found', 'true')
            core.setOutput('artifact_id', String(artifact.id))
            core.setOutput('run_id', String(artifact.workflow_run.id))

      # Gated on `locate`, NOT `resolve`: resolve runs after this step, so
      # depending on it here would evaluate an output that does not exist yet
      # and silently skip the download for every PR that DID upload an artifact.
      - name: Download run directory
        if: steps.locate.outputs.found == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.locate.outputs.run_id }}
          artifact-ids: ${{ steps.locate.outputs.artifact_id }}
          path: run-dir

      # Second source for the run directory, and the one that works today.
      #
      # A workflow artifact can only be created from inside a workflow run, but
      # this pipeline runs on an engineer's machine - so nothing was ever in a
      # position to upload `evidence-run-<sha>`, and the check could only ever
      # fail with "no artifact found". Running the whole seven-stage pipeline in
      # CI instead would mean Claude credentials as a repo secret and ~20 minutes
      # of API spend on every pull request.
      #
      # So the pipeline commits its run directory to the branch at
      # .agent/evidence-run/ and CI reads it from the checkout. No secrets, no
      # per-PR cost, and the evidence lands in the diff where a reviewer can
      # read it rather than in an artifact that expires. The artifact path above
      # still wins when one exists, so a future CI-side run needs no change here.
      - name: Resolve run directory
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ steps.locate.outputs.found }}" = "true" ]; then
            echo "run_dir=$GITHUB_WORKSPACE/run-dir" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "source=uploaded artifact evidence-run-<sha>"
          elif [ -d "$GITHUB_WORKSPACE/.agent/evidence-run" ]; then
            echo "run_dir=$GITHUB_WORKSPACE/.agent/evidence-run" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "source=committed .agent/evidence-run/"
            ls -1 "$GITHUB_WORKSPACE/.agent/evidence-run"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no evidence: neither an uploaded artifact nor .agent/evidence-run/"
          fi

      - name: Assemble bundle
        id: assemble
        if: steps.resolve.outputs.found == 'true'
        working-directory: engineering
        run: |
          set +e
          node scripts/assemble-bundle.mjs \
            --run-dir "${{ steps.resolve.outputs.run_dir }}" \
            --out "$GITHUB_WORKSPACE/bundle.json" \
            > "$GITHUB_WORKSPACE/assemble.log" 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_WORKSPACE/assemble.log"

      - name: Validate bundle
        id: validate
        if: steps.resolve.outputs.found == 'true'
        working-directory: engineering
        run: |
          set +e
          node scripts/validate-bundle.mjs "$GITHUB_WORKSPACE/bundle.json" \
            > "$GITHUB_WORKSPACE/validate.log" 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_WORKSPACE/validate.log"

      - name: Render summary
        id: render
        if: steps.resolve.outputs.found == 'true'
        working-directory: engineering
        run: |
          node scripts/bundle-summary.mjs "$GITHUB_WORKSPACE/bundle.json" \
            > "$GITHUB_WORKSPACE/summary.md" 2> "$GITHUB_WORKSPACE/render.log" || true

      - name: Post evidence-bundle check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          # Passed via env, not interpolated into the script body — the
          # script contains a literal `${{ }}` substitution only where the
          # value is guaranteed to be one of a fixed set of tokens; anything
          # that could carry quotes, backticks or newlines (log/file
          # contents) is read from disk instead, never templated in.
          FOUND: ${{ steps.resolve.outputs.found }}
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs')
            const headSha = context.payload.pull_request.head.sha
            const found = process.env.FOUND === 'true'
            const readOr = (path, fallback) => (fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : fallback)

            let conclusion, title, summary, text

            if (!found) {
              conclusion = 'failure'
              title = 'No evidence-run artifact found'
              summary = [
                `Expected a workflow artifact named \`evidence-run-${headSha}\` carrying this PR's run directory.`,
                'None was found. Missing evidence fails this check — see engineering/docs/evidence-bundle.md for the run-directory contract.',
              ].join('\n\n')
              text = 'Nothing to assemble, validate, or summarize without the run directory.'
            } else {
              const validateExit = process.env.VALIDATE_EXIT
              const validateLog = readOr('validate.log', '(validate-bundle.mjs produced no output)')
              const assembleLog = readOr('assemble.log', '(assemble-bundle.mjs produced no output)')
              const summaryMd = readOr('summary.md', '(summary not rendered)')
              const ok = validateExit === '0'

              conclusion = ok ? 'success' : 'failure'
              title = ok ? 'Evidence bundle valid' : 'Evidence bundle incomplete — missing evidence fails the PR'
              summary = ok
                ? 'All required evidence is present and the bundle validates against schemas/evidence-bundle.v0.1.schema.json.'
                : validateLog
              text = ok
                ? summaryMd
                : ['## Assemble log', '```', assembleLog, '```', '## Validate log', '```', validateLog, '```'].join('\n')
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'evidence-bundle',
              head_sha: headSha,
              status: 'completed',
              conclusion,
              output: {
                title,
                summary: summary.slice(0, 65000),
                text: text.slice(0, 65000),
              },
            })

            if (conclusion === 'failure') core.setFailed(title)

  diff-size:
    name: diff-size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Excludes test and generated paths so the cap tracks reviewable
      # hand-written surface, not fixture data or lockfile churn.
      - name: Compute diff size
        id: diff
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          NUMSTAT=$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" -- . \
            ':(exclude)**/*.test.*' \
            ':(exclude)**/*.spec.*' \
            ':(exclude)**/__tests__/**' \
            ':(exclude)**/tests/**' \
            ':(exclude)**/test/**' \
            ':(exclude)**/test-*.mjs' \
            ':(exclude)dist/**' \
            ':(exclude).output/**' \
            ':(exclude).nuxt/**' \
            ':(exclude).nitro/**' \
            ':(exclude).cache/**' \
            ':(exclude)coverage/**' \
            ':(exclude)package-lock.json' \
            ':(exclude)bun.lockb' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)yarn.lock')

          FILES=$(printf '%s\n' "$NUMSTAT" | grep -c . || true)
          LINES=$(printf '%s\n' "$NUMSTAT" | awk '{ add=$1; del=$2; if (add=="-") add=0; if (del=="-") del=0; total += add + del } END { print total+0 }')

          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          {
            echo 'numstat<<EVIDENCE_BUNDLE_EOF'
            printf '%s\n' "$NUMSTAT"
            echo 'EVIDENCE_BUNDLE_EOF'
          } >> "$GITHUB_OUTPUT"

          echo "changed files (excluding test/generated): $FILES"
          echo "changed lines (excluding test/generated): $LINES"

      - name: Post diff-size check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          # DIFF_NUMSTAT is arbitrary multi-line diff output — passed via
          # env and read from process.env, never templated into the script
          # body. A `${{ }}` substitution containing a backtick or newline
          # would both break this script's syntax and, more seriously, let
          # a crafted file path in the diff inject arbitrary JS into a
          # step that holds a GITHUB_TOKEN with checks:write.
          DIFF_FILES: ${{ steps.diff.outputs.files }}
          DIFF_LINES: ${{ steps.diff.outputs.lines }}
          DIFF_NUMSTAT: ${{ steps.diff.outputs.numstat }}
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha
            const files = Number(process.env.DIFF_FILES)
            const lines = Number(process.env.DIFF_LINES)
            const numstat = (process.env.DIFF_NUMSTAT || '').trim()

            const FILE_LIMIT = 10
            const LINE_LIMIT = 400
            const overFiles = files > FILE_LIMIT
            const overLines = lines > LINE_LIMIT
            const conclusion = overFiles || overLines ? 'failure' : 'success'

            const why = [
              'Why this exists: review capacity is the actual constraint, not diff size for its own sake.',
              'As the agent-authored share of PRs rises, reviewer minutes per PR only stay flat if PRs stay',
              'small enough to review at a constant rate. This cap keeps a single PR from quietly becoming',
              'a multi-hour review because an agent kept going. It is not a judgment on the change — split',
              'it into follow-up PRs, or ask for the limit to be raised for this one with a stated reason.',
            ].join('\n')

            const title = conclusion === 'success'
              ? `Diff size OK — ${files} file(s), ${lines} line(s)`
              : `Diff too large — ${files} file(s) (limit ${FILE_LIMIT}), ${lines} line(s) (limit ${LINE_LIMIT})`

            const summary = [
              `**Files changed:** ${files} (limit ${FILE_LIMIT})`,
              `**Lines changed:** ${lines} (limit ${LINE_LIMIT})`,
              '',
              'Test paths (`**/tests/**`, `**/*.test.*`, `**/*.spec.*`, `**/test-*.mjs`, …) and',
              'generated/build paths (`dist/`, `.output/`, `.nuxt/`, lockfiles, …) are excluded from these counts.',
              '',
              why,
            ].join('\n')

            const text = numstat
              ? ['## Counted changes (post-exclusion)', '```', numstat, '```'].join('\n')
              : '_No non-excluded changes._'

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'diff-size',
              head_sha: headSha,
              status: 'completed',
              conclusion,
              output: { title, summary, text },
            })

            if (conclusion === 'failure') core.setFailed(title)
