# CI
#
# Four independent jobs on every pull_request and every push to main. There is
# no test framework in this repo — every suite is a plain Node script using
# node:assert/strict — so each job below is a thin, deliberately unclever
# wrapper around commands you can run yourself on a laptop. See the bottom of
# this file for what is NOT covered (Playwright e2e) and why.
#
#   test-suites
#     Runs every scripts/test-*.mjs and engineering/scripts/test-*.mjs with
#     `node`. Each suite's exit code is checked individually and OR'd into the
#     job's own exit code — nothing is piped through something that would
#     swallow a non-zero exit. All 24 suites currently pass locally; see
#     engineering/docs (or ask) if that count drifts and this comment goes
#     stale.
#
#     KNOWN RISK, not yet resolved by this workflow: scripts/test-sdk.mjs
#     shells out to the bundled Claude Code CLI via
#     @anthropic-ai/claude-agent-sdk's query(), which needs either a live
#     ANTHROPIC_API_KEY or an authenticated Claude Code session to get past
#     "Claude Code process exited". Neither exists on a bare GitHub-hosted
#     runner. This was NOT run against a runner without ambient credentials —
#     see the PR/commit description for what to do about it (add an
#     ANTHROPIC_API_KEY repo secret, or move this one suite out of CI) before
#     trusting a green test-suites run that included it.
#
#   typecheck
#     `node node_modules/vue-tsc/bin/vue-tsc.js -b --noEmit` — NOT
#     `npm run typecheck`, which shells through `npx` and resolves a broken
#     typescript@7.0.2 (see package.json / npx cache resolution; the pinned
#     devDependency is typescript@^5.7 but npx has been observed to ignore
#     it). There is exactly one known pre-existing error, in a file this
#     workflow may not touch (scripts/test-workflow-graph.mjs). See the
#     step's own comment for how it's handled and why.
#
#   (no standalone `build` job — see docker-image)
#     There used to be one running `npm run build` on the runner. It was
#     removed because docker-image already runs `bun run build` inside the
#     image on every pull request, and a Nuxt build that fails there fails
#     that job. Its stated purpose — catching an import that resolves under
#     Node's resolver but not Vite's — is covered, because the Docker build
#     runs the same Vite build.
#
#     What the removal DOES give up: the npm/Node 24 toolchain is no longer
#     exercised by a build. That is deliberate. Nothing ships on it — the
#     image installs with `bun install --frozen-lockfile` from bun.lockb —
#     so the removed job was gating merges on a toolchain no deployment uses
#     while the one that ships was gated by a job nobody thought of as the
#     build gate. Now the build gate is the build that ships.
#
#     The real hazard this leaves standing: the repo carries BOTH
#     package-lock.json and bun.lockb, and nothing checks they agree.
#     test-suites and typecheck still install with `npm ci`, so the two
#     dependency graphs can drift and the first symptom would be an image
#     that behaves differently from a green CI run. Converging on one
#     package manager is the fix; it is not this change.
#
#   validate-registry
#     `node engineering/scripts/validate-registry.mjs` — schema + semantic
#     checks over watches.yaml/products.yaml. Deliberately dependency-free
#     and credential-free by design (see the script's own header); this job
#     does not change that, and never passes `--repos` (which would clone
#     every registered repo — out of place in an offline PR gate).
#
#   docker-image
#     Builds the actual deployable artifact (`Dockerfile` — this is what
#     `docker-compose.yml` runs) on every PR and push to main; PUSHES it to
#     `ghcr.io/alepolab/agent-manager` only on push to main (see "When this
#     pushes" below).
#
#     THE BAKED-CONFIG COPY: `Dockerfile` does
#     `COPY docker/claude-config /root/.claude` — a curated snapshot of a
#     real operator's `~/.claude`, produced by `scripts/stage-claude-config.sh`
#     and deliberately git-ignored (it can hold plugin bodies and, if
#     mis-curated, worse). A checkout on a bare runner does not have this
#     directory at all, and does not have a `~/.claude` to stage one from
#     either — there is no OAuth session, no installed plugins, nothing.
#     `COPY` fails the whole build if its source path does not exist, so
#     this job runs `mkdir -p docker/claude-config` immediately after
#     checkout to guarantee an (empty) directory is there. This is a
#     DELIBERATE, DOCUMENTED trade-off, not a workaround:
#       - The image this job builds and pushes ships with NO baked Claude
#         config — `/root/.claude` is empty in the image. Nothing here
#         reconstructs plugins/skills/agents/settings.json; the repo has no
#         source for most of that (plugins are pulled from a marketplace at
#         install time, on a real machine, by a human).
#       - Because `docker-compose.yml` mounts a NAMED volume over that path,
#         and a named volume seeds ONLY from the image on first creation
#         (see docs/baked-claude-config.md), a fresh deployment from THIS
#         image starts with an empty `~/.claude` until something writes to
#         it (through the UI, or via `HOST_CLAUDE_DIR`) — it does NOT
#         silently ship stale or wrong config; it ships none.
#       - A production deploy that wants the curated, self-contained image
#         docs/baked-claude-config.md describes still needs a human to run
#         `./scripts/stage-claude-config.sh` locally and build from that —
#         CI cannot do this step because it has nothing to stage from. This
#         job answers "does the Dockerfile still build, and is there a
#         pushed image to pull for a quick look" — not "here is the curated
#         production artifact."
#     This is a judgment call, flagged for confirmation rather than assumed:
#     an alternative is to skip pushing entirely until staging can happen
#     in CI (e.g. from a secret-backed config bundle), which would need a
#     source of truth for that config that does not exist today.
#
#     TAGGING (github.com/alepolab CLAUDE.md is explicit and firm on this):
#     `<branch>-<yyyymmdd>-<shortsha>`, e.g. `main-20260905-8799ff9`. No bare
#     `latest` (this workflow never pushes one, on main or anywhere else). No
#     bare `sha-<shortsha>` (the branch always appears alongside it, one
#     value in the `tags:` input, not two separate tags). The estate has two
#     repos violating these rules already (`pms-billing`: bare `latest` +
#     bare `sha-<sha>`; `pc`: a double-hyphen `ci-release--20260903-…` from
#     an un-sanitized branch name) — neither pattern is copied here. Branch
#     names can contain `/` (`fix/JIRA-1234`) and, on a fork PR, arbitrary
#     characters (`github.head_ref` is untrusted input), so the branch
#     component is read via `env:` (never templated directly into a `run:`
#     body) and passed through `tr -c 'A-Za-z0-9_.-' '-'` before it becomes
#     part of an image tag.
#
#     IMAGE NAME: `ghcr.io/alepolab/agent-manager`, chosen from the repo name
#     (`alepolab/agent-manager` — confirmed via `git remote -v` and the
#     existing `agent-manager_claude-config` compose volume name), NOT from
#     `package.json`'s `"name": "agents-ui"`. CLAUDE.md warns "repo name ≠
#     image name" for repos with an established GHCR package already; this
#     repo has never published one, so there is no existing convention to
#     preserve or contradict. Flagged in the PR/commit description for
#     explicit confirmation rather than assumed silently.
#
#     WHEN THIS PUSHES, and why: build (validate the Dockerfile) on every
#     pull_request; build AND push only on push to main. Pushing an image
#     for every PR fills the registry with disposable, never-deployed tags —
#     noise with no consumer. Building on every PR still catches a broken
#     Dockerfile (a `COPY` of a path that stopped existing, a `bun install`
#     that stopped resolving) before merge, which is the useful half of "one
#     package per repo": this workflow never creates more than the one
#     `ghcr.io/alepolab/agent-manager` package, and only writes to it from
#     `main`.
#
#     AUTH: the built-in `GITHUB_TOKEN` via `docker/login-action`, scoped by
#     a job-level (not workflow-level) `permissions: packages: write` — no
#     secret to add, and `contents: read`/`packages: write` here does not
#     leak to the other four jobs, which stay at the workflow-level
#     `contents: read` only. The login step itself only runs on push (no
#     credential is requested for a build-only PR run at all).
#
# Deliberately NOT included:
#
#   - `npm run test:e2e` (Playwright smoke test): boots a dev server and
#     needs Chromium's system libraries (libnspr4, libnss3, libasound2t64),
#     which are not installed on a default GitHub-hosted runner and are not
#     installed by this workflow. `package.json`'s own `e2e:libs` script
#     downloads and extracts them without root, which suggests it CAN be
#     made to work here — but that is unverified from this workflow (no
#     runner was available to try it against), so it is left as a follow-up
#     rather than a step that might be silently broken from day one.
#
#   - Template drift (`node scripts/sync-agents.mjs --dry-run`): checked
#     locally against an empty CLAUDE_DIR (`CLAUDE_DIR=/tmp/empty node
#     scripts/sync-agents.mjs --dry-run`) and it reports every sdlc-* agent
#     and both seeded skills as "missing", exit 1 — because there is no
#     `~/.claude` on a fresh runner for it to compare against, not because
#     anything drifted. This check is answering "does this developer's local
#     ~/.claude match the repo", a question a stateless runner cannot ask.
#     Adding it here would be a step that fails every single run,
#     unconditionally, which the brief for this workflow explicitly rules
#     out. It stays a local/pre-push check.
#
# Standards followed (github.com/alepolab CLAUDE.md, GitHub Actions section):
#   - actions pinned to a commit SHA, not a tag (same pins as
#     the retired evidence-bundle workflow, for the same versions)
#   - minimal `permissions:` at workflow level (contents: read only — no job
#     here calls the Checks/PRs API)
#   - a concurrency group that cancels a superseded run
#   - dependency caching (setup-node's built-in npm cache, keyed on
#     package-lock.json)
#   - no secrets are read or echoed by this workflow

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-suites:
    name: test-suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run every test-*.mjs suite
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(scripts/test-*.mjs engineering/scripts/test-*.mjs)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No scripts/test-*.mjs or engineering/scripts/test-*.mjs files found — that is a broken CI config, not a pass."
            exit 1
          fi

          echo "found ${#files[@]} suite(s)"
          fail=0
          for f in "${files[@]}"; do
            echo "::group::${f}"
            if node "$f"; then
              echo "PASS  ${f}"
            else
              code=$?
              echo "FAIL  ${f} (exit ${code})"
              echo "::error file=${f}::suite failed (exit ${code})"
              fail=1
            fi
            echo "::endgroup::"
          done

          exit "$fail"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deliberately NOT `npm run typecheck` (nuxt typecheck) — that shells
      # through `npx vue-tsc`, and npx has been observed to resolve a
      # standalone typescript@7.0.2 instead of the pinned ^5.7 devDependency,
      # which changes error output out from under this gate without a commit
      # to blame. Calling the installed binary directly pins the toolchain to
      # exactly what package-lock.json resolved.
      - name: Typecheck (vue-tsc -b, not npm run typecheck)
        run: |
          set +e
          node node_modules/vue-tsc/bin/vue-tsc.js -b --noEmit > /tmp/tsc.log 2>&1
          code=$?
          cat /tmp/tsc.log
          set -e

          if [ "$code" -eq 0 ]; then
            echo "typecheck clean"
            exit 0
          fi

          # No baseline any more. The project typechecks clean, so any error at
          # all fails this job.
          #
          # What used to be here was a byte-for-byte match against one known
          # error - and that error was a PARSE failure in
          # scripts/test-workflow-graph.mjs, which aborted the build before the
          # rest of the project was ever checked. The job was green because
          # nothing ran. Fixing that one line surfaced 245 real errors across
          # app/ and server/, including a missing `relative` import that would
          # have thrown at runtime, a write to a read-only computed that Vue
          # refuses, and two unreachable branches in the chat endpoint. All are
          # now fixed; if this ever needs a baseline again, that is a signal to
          # fix the errors, not to re-add one.
          echo "::error::typecheck failed (see log above)"
          exit 1

  validate-registry:
    name: validate-registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No dependencies, no credentials, no network by design (see the
      # script's own header) — never pass --repos here, which would clone
      # every registered repo and turn an offline check into a networked one.
      - name: Validate registry
        run: node engineering/scripts/validate-registry.mjs

  docker-image:
    name: docker-image
    runs-on: ubuntu-latest
    # Job-scoped, not workflow-scoped: only this job talks to GHCR, so only
    # this job gets packages: write. The other four jobs stay at the
    # workflow-level `contents: read` above.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # docker/claude-config is git-ignored (it's a curated snapshot of a
      # real ~/.claude, produced locally by scripts/stage-claude-config.sh)
      # and does not exist on a fresh checkout. Dockerfile's
      # `COPY docker/claude-config /root/.claude` fails the entire build if
      # its source path is missing — not just an empty image, an outright
      # build failure — so this guarantees the path exists before Docker
      # ever sees it. The image this job builds therefore ships with an
      # EMPTY /root/.claude: no plugins, skills, agents, or settings.json
      # baked in. See the long comment at the top of this file for why that
      # is a deliberate trade-off rather than an oversight, and what it
      # means for a real deploy.
      - name: Ensure the baked-config COPY has a source (CI has no ~/.claude to stage from)
        run: mkdir -p docker/claude-config

      # Branch name is untrusted on a fork PR (github.head_ref) and can
      # contain '/', so it is read via env: (never templated into the run:
      # body — see the security note this repo's own tooling flags on
      # workflow edits) and sanitized to Docker's tag charset before use.
      - name: Compute image tag (<branch>-<yyyymmdd>-<shortsha>)
        id: tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="${HEAD_REF:-$REF_NAME}"
          sha="${PR_HEAD_SHA:-$PUSH_SHA}"

          # Docker tag components allow only [A-Za-z0-9_.-]; a branch like
          # "fix/JIRA-1234" or a crafted fork branch name must not produce an
          # invalid tag or, worse, a double-hyphen artifact (see pc's
          # ci-release--20260903-… bug, which this sanitization avoids: any
          # run of invalid characters collapses to a single '-', and leading/
          # trailing '-'/'.' are trimmed so a branch starting or ending in a
          # slash doesn't leave one behind).
          safe_branch="$(printf '%s' "$branch" | tr -c 'A-Za-z0-9_.-' '-')"
          safe_branch="$(printf '%s' "$safe_branch" | sed -E 's/^[-.]+//; s/[-.]+$//')"
          if [ -z "$safe_branch" ]; then
            safe_branch="unknown"
          fi

          date="$(date -u +%Y%m%d)"
          short_sha="${sha:0:7}"
          tag="${safe_branch}-${date}-${short_sha}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "computed image tag: ${tag}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Only push on a push-to-main event (the only push trigger this
      # workflow has — see `on:` above), never for a pull_request build. No
      # secret to add: GITHUB_TOKEN is minted per-run by Actions.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build on every pull_request (catches a broken Dockerfile before
      # merge); push only on push to main. A single tag, never `latest`,
      # never a bare sha — see the top-of-file comment for the reasoning and
      # the two known-bad patterns elsewhere in the estate this deliberately
      # does not copy.
      - name: Build image (push only on main)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/alepolab/agent-manager:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
