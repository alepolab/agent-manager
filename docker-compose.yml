services:
  agents-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agents-ui
    restart: unless-stopped
    ports:
      - "3030:3030"
    volumes:
      # A NAMED volume, not a bind mount, and the distinction matters.
      #
      # Docker seeds a new named volume from whatever the image has at that path
      # on first creation, so the curated config baked in by the Dockerfile
      # becomes the starting state, and anything created through the UI persists
      # across restarts and image rebuilds.
      #
      # The previous `~/.claude:/root/.claude` bind mount did two things we did
      # not want: it hid the image's own config entirely (a bind mount shadows
      # image content), and it let the container write directly into the
      # operator's live Claude configuration.
      #
      # A named volume is seeded ONLY ON CREATION, not on every `up`. Rebuilding
      # the image (`--build`) does NOT refresh a deployed instance's baked
      # config — the volume already exists and is left alone. To pick up newly
      # baked config after a rebuild, the volume must be removed so it reseeds:
      #   docker compose down && docker volume rm agent-manager_claude-config
      # That discards anything created through the UI, which is why it is not
      # the default. See docs/baked-claude-config.md for the full redeploy
      # sequence (stage -> build -> remove volume -> up) — skipping any one
      # step is how a rebuild has twice shipped a stale image before.
      #
      # Escape hatch: set HOST_CLAUDE_DIR to an absolute host path (e.g.
      # $HOME/.claude) to bind-mount it here INSTEAD of the named volume, so
      # this container reads and writes the exact same `~/.claude` a workflow
      # started on the host with `node scripts/run-ticket.mjs` used — that is
      # the only way this container will ever see a run written by the host
      # CLI, since the two stores are otherwise unrelated filesystems. Doing
      # so SHADOWS the image's baked config entirely (a bind mount hides
      # whatever the image put at this path) — the curated agents/skills/
      # plugins this image ships with will NOT appear unless the host
      # directory already has them. This is exactly the trade-off the project
      # moved away from by switching to a named volume; opt in only when you
      # specifically want this container sharing state with a host directory,
      # and expect it to shadow the baked config while you do. Leave unset for
      # the default, self-contained behaviour (nothing changes for existing
      # deployments).
      - ${HOST_CLAUDE_DIR:-claude-config}:/root/.claude
      # Run ARTIFACTS (server/utils/runArtifacts.ts, AGENT_RUNS_DIR) live
      # outside CLAUDE_DIR on purpose (see that file's doc comment) and so
      # need their own volume — without one, a deployed run's artifacts sit on
      # the container's writable layer and are lost the moment the container
      # is recreated, silently, with no error. This volume is new and has no
      # prior data to preserve, so there is no seeding concern here the way
      # there is for claude-config above.
      #
      # Same escape hatch as above: set HOST_AGENT_RUNS_DIR to an absolute
      # host path (e.g. $HOME/.agent-manager/workflow-runs) to bind-mount the
      # exact directory `run-ticket.mjs` on the host writes artifacts into.
      # The run RECORD (workflowRunStore.ts) is under CLAUDE_DIR above, so
      # seeing a full host-started run in this container's UI requires both
      # HOST_CLAUDE_DIR and HOST_AGENT_RUNS_DIR set consistently, together.
      - ${HOST_AGENT_RUNS_DIR:-agent-runs}:/root/.agent-manager/workflow-runs
      # The run RECORDS — one JSON per run, the thing /runs lists. They sit
      # under CLAUDE_DIR because that is where workflowRunStore.ts puts them,
      # and that is the problem: the redeploy sequence documented above DELETES
      # the claude-config volume to reseed baked config, and took the run
      # history with it. Six runs on this machine still have a full artifacts
      # directory and no record — invisible in the UI, with the evidence
      # sitting on disk.
      #
      # A volume mounted INSIDE another volume's path wins for that subtree, so
      # the records now live in their own volume and survive the reseed. The
      # image creates this directory bun-owned so a fresh volume seeds with the
      # right ownership; an EXISTING deployment's records must be copied in
      # once, or they stay hidden under the mount:
      #   docker compose down
      #   docker run --rm -v agent-manager_claude-config:/old \
      #     -v agent-manager_workflow-records:/new alpine \
      #     sh -c 'cp -a /old/workflow-runs/. /new/ 2>/dev/null || true'
      - workflow-records:/root/.claude/workflow-runs
    environment:
      - CLAUDE_DIR=/root/.claude
      - AGENT_RUNS_DIR=/root/.agent-manager/workflow-runs
      - HOST=0.0.0.0
      - PORT=3030
      - NODE_ENV=production
      # Optional. Supplies credentials for importing PRIVATE GitHub repos.
      # Absent or empty means unauthenticated git, and public imports still
      # work — so leaving this unset is a supported configuration, not a
      # broken one. Populate it from your own login rather than minting a
      # long-lived secret:
      #
      #   GITHUB_TOKEN=$(gh auth token) docker compose up -d
      #
      # The token is passed through the environment only; it is never written
      # into the image, the volume, or any file the container keeps.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    # Keep the logs, and keep them bounded.
    #
    # `docker logs agents-ui` returned FOUR lines after a container recreate:
    # every runner log line from 8-21 Sep — thirteen days, thirteen real runs,
    # every preflight verdict, every stack command, every agent failure — was
    # gone, because docker's default json-file driver keeps a container's logs
    # ON THE CONTAINER, and recreating one (a rebuild, an image bump, a compose
    # edit) throws the old container and its whole log away. Nothing here wrote
    # to a file, so there was no second copy: the only record of what a run did
    # at 03:00 was in a buffer that no longer exists.
    #
    # This does NOT survive a recreate either — nothing in a compose logging
    # driver can — but it does two things that matter: it caps the size so a
    # long-lived container cannot fill the disk with one unrotated file (the
    # default is unlimited), and it keeps five rotations instead of one, so the
    # history reaches back past the last few minutes while the container lives.
    # Shipping the logs somewhere that outlives the container is a separate job
    # and deliberately not smuggled in here.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  claude-config:
  agent-runs:
  workflow-records:
