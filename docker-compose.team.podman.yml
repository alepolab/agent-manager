# Team stack for THIS host (rootless podman on WSL). A standalone file, not an
# override.
#
#   docker compose -f docker-compose.team.podman.yml up -d
#
# docker-compose.team.yml remains the canonical team definition and is written
# for a host running a real Docker daemon. It cannot be used here unchanged,
# and it cannot be adjusted with an override file either: Compose MERGES volume
# lists rather than replacing them, so a shorter list leaves the base entries
# in place, and the `!override` tag that would fix that needs Compose v2 - this
# box has the Python docker-compose 1.29.2 shim, which errors on it. Verified
# both ways before writing this file.
#
# What differs from the canonical file, and why:
#
#   /var/run/docker.sock   -> the podman socket. API compatible, so no app change.
#   /usr/bin/docker        -> dropped. Present here, but it is a podman-backed
#                             shim whose binary will not run in a Debian image.
#   cli-plugins mount      -> dropped. The path does not exist on this host.
#   group_add DOCKER_GID   -> dropped. There is no docker group here; the
#                             rootless socket is owned by the invoking user.
#
# The socket is durable: `podman.socket` is a systemd USER UNIT, enabled with
# lingering on, so it comes up at boot and outlives every shell. It replaced a
# `podman system service` process that died with its shell and was gone after a
# reboot - taking the provisioner's ability to start anything with it, silently,
# while the app carried on reporting healthy.
#
# `podman-restart.service` is enabled alongside it, which is what brings this
# container back after a reboot given its `restart: unless-stopped`.
#
# Keep in step with docker-compose.team.yml by hand - nothing enforces it.
services:
  agents-ui:
    # Built from this tree by: docker build -t agent-manager:team -f Dockerfile .
    # Referenced rather than rebuilt, so `up` does not repeat a ten-minute build.
    image: agent-manager:team
    container_name: agents-ui-team
    restart: unless-stopped
    ports: ["3030:3030"]
    environment:
      - HOST=0.0.0.0
      - PORT=3030
      - NODE_ENV=production
      - HOME=/srv/agent-manager
      - CLAUDE_DIR=/srv/agent-manager/claude
      - AGENT_RUNS_DIR=/srv/agent-manager/runs
      - AGENT_USERS_DIR=/srv/agent-manager/users
      - AGENT_WORKSPACE_ROOT=/srv/agent-manager/workspace
      - TEAM_SEED_ON_BOOT=1
      - AGENT_MANAGER_SECRET=${AGENT_MANAGER_SECRET:?set a 32+ character secret}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?register the GitHub OAuth app}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?register the GitHub OAuth app}
      - GITHUB_ORG=${GITHUB_ORG:-alepolab}
      - AGENT_MANAGER_URL=${AGENT_MANAGER_URL:-http://localhost:3030}
      - JIRA_TICKET_SOURCE=${JIRA_TICKET_SOURCE:-cli}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - AGENT_RUN_MAX_MINUTES=${AGENT_RUN_MAX_MINUTES:-180}
      - AGENT_RUN_MAX_TOKENS=${AGENT_RUN_MAX_TOKENS:-8000000}
    volumes:
      - team-home:/srv/agent-manager
      - ${PODMAN_SOCK:-/run/user/9870/podman/podman.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  team-home:
